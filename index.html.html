<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator - By FCCode Traversal</title>
</head>
<body>

    <div class="calculator">

        <input type="text" placeholder="0" id="inputBox">

        <button class="oporetor">AC</button>
        <button class="oporetor">DEL</button>
        <button class="oporetor">%</button>
        <button class="oporetor">/</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="oporetor">*</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="oporetor">-</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="oporetor">+</button>

        <button>00</button>
        <button>0</button>
        <button>.</button>
        <button class="equalBtn">=</button>

    </div>
    <script src="script.js"></script>



</body>
</html>
